<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CafeHub - Payment Failed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .content-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .fail-card { text-align: center; background: white; padding: 50px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        .crossmark { font-size: 60px; color: #dc3545; }
    </style>
</head>
<body>
    <div class="content-wrap">
        <div class="fail-card">
            <div class="crossmark">❌</div>
            <h3 class="mt-3">Payment Failed</h3>
            <p class="text-muted">Something went wrong or the payment was cancelled.</p>
            <a href="/views/my-orders.html" class="btn btn-danger mt-3">Back to My Orders</a>
        </div>
    </div>

    <footer class="py-4" style="background-color: #ff6600; color: white;">
        <div class="container text-center">
            <p class="mb-1 fw-bold">🍽️ CafeHub - Cafeteria Management System</p>
            <p class="mb-1 small">Developed by Rikisha Maharjan</p>
            <p class="mb-0 small">© 2026 CafeHub. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>

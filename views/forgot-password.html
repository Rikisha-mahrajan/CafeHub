<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeHub - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .content-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
        .card { max-width: 400px; width: 100%; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #ff6600; border-color: #ff6600; width: 100%; }
        .btn-primary:hover { background-color: #e65c00; }
        h2 { color: #ff6600; text-align: center; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="content-wrap">
        <div class="card">
            <h2>🍽️ Forgot Password</h2>
            <div id="message"></div>
            <p class="text-muted text-center small">Enter your email and we'll send you a reset link.</p>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>
            <button class="btn btn-primary" onclick="sendReset()">Send Reset Link</button>
            <p class="text-center mt-3"><a href="/">Back to Login</a></p>
        </div>
    </div>

    <script>
        async function sendReset() {
            const email = document.getElementById('email').value;
            if (!email) {
                document.getElementById('message').innerHTML = '<div class="alert alert-warning">Please enter your email</div>';
                return;
            }

            const res = await fetch('/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();
            document.getElementById('message').innerHTML = `<div class="alert alert-success">${data.message}</div>`;
        }
    </script>

    <footer class="py-2" style="background-color: #ff6600; color: white;">
        <div class="container text-center">
            <p class="mb-1 fw-bold">🍽️ CafeHub - Cafeteria Management System</p>
            <p class="mb-1 small">Developed by Rikisha Maharjan</p>
            <p class="mb-0 small">© 2026 CafeHub. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeHub - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .content-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
        .card { max-width: 400px; width: 100%; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #ff6600; border-color: #ff6600; width: 100%; }
        .btn-primary:hover { background-color: #e65c00; }
        h2 { color: #ff6600; text-align: center; margin-bottom: 25px; }
        .strength-bar { height: 6px; border-radius: 3px; transition: all 0.3s; margin-top: 6px; }
        .strength-text { font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="content-wrap">
        <div class="card">
            <h2>🍽️ Reset Password</h2>
            <div id="message"></div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
    <input type="password" id="password" class="form-control" placeholder="Enter new password" oninput="checkStrength()">
    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', this)">
        <i class="bi bi-eye"></i>
    </button>
</div>
                <div class="strength-bar" id="strength-bar" style="background:#eee;"></div>
                <div class="strength-text" id="strength-text"></div>
                <ul class="mt-2 small" id="req-list" style="display:none; color:red; padding-left:20px;">
                    <li id="req-length" style="display:none;">At least 8 characters</li>
                    <li id="req-upper" style="display:none;">At least one uppercase letter</li>
                    <li id="req-lower" style="display:none;">At least one lowercase letter</li>
                    <li id="req-number" style="display:none;">At least one number</li>
                    <li id="req-special" style="display:none;">At least one special character</li>
                </ul>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
    <input type="password" id="confirm-password" class="form-control" placeholder="Confirm new password" oninput="checkMatch()">
    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm-password', this)">
        <i class="bi bi-eye"></i>
    </button>
</div>
                <div class="small mt-1" id="match-text"></div>
            </div>
            <button class="btn btn-primary" onclick="resetPassword()">Reset Password</button>
            <p class="text-center mt-3"><a href="/">Back to Login</a></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('message').innerHTML = '<div class="alert alert-danger">Invalid reset link.</div>';
        }

        function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        field.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}

        function checkStrength() {
            const password = document.getElementById('password').value;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            const reqList = document.getElementById('req-list');
            if (password.length === 0) { reqList.style.display = 'none'; bar.style.background = '#eee'; bar.style.width = '0%'; text.textContent = ''; return; }

            reqList.style.display = 'block';
            document.getElementById('req-length').style.display = hasLength ? 'none' : 'list-item';
            document.getElementById('req-upper').style.display = hasUpper ? 'none' : 'list-item';
            document.getElementById('req-lower').style.display = hasLower ? 'none' : 'list-item';
            document.getElementById('req-number').style.display = hasNumber ? 'none' : 'list-item';
            document.getElementById('req-special').style.display = hasSpecial ? 'none' : 'list-item';

            const score = [hasLength, hasUpper, hasLower, hasNumber, hasSpecial].filter(Boolean).length;
            if (score <= 2) { bar.style.background = '#dc3545'; bar.style.width = '33%'; text.textContent = '🔴 Weak'; text.style.color = '#dc3545'; }
            else if (score <= 4) { bar.style.background = '#ffc107'; bar.style.width = '66%'; text.textContent = '🟡 Medium'; text.style.color = '#ffc107'; }
            else { bar.style.background = '#198754'; bar.style.width = '100%'; text.textContent = '🟢 Strong'; text.style.color = '#198754'; }
        }

        function checkMatch() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const matchText = document.getElementById('match-text');
            if (confirm === '') { matchText.textContent = ''; }
            else if (password === confirm) { matchText.textContent = '✅ Passwords match'; matchText.style.color = 'green'; }
            else { matchText.textContent = '❌ Passwords do not match'; matchText.style.color = 'red'; }
        }

        async function resetPassword() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (!password) { document.getElementById('message').innerHTML = '<div class="alert alert-warning">Please enter a password</div>'; return; }
            if (password !== confirm) { document.getElementById('message').innerHTML = '<div class="alert alert-danger">Passwords do not match</div>'; return; }

            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            if (!hasLength || !hasUpper || !hasLower || !hasNumber || !hasSpecial) {
                document.getElementById('message').innerHTML = '<div class="alert alert-danger">Password does not meet requirements</div>';
                return;
            }

            const res = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            });

            const data = await res.json();
            if (res.ok) {
                document.getElementById('message').innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                setTimeout(() => window.location.href = '/', 2000);
            } else {
                document.getElementById('message').innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        }
    </script>

    <footer class="py-2" style="background-color: #ff6600; color: white;">
        <div class="container text-center">
            <p class="mb-1 fw-bold">🍽️ CafeHub - Cafeteria Management System</p>
            <p class="mb-1 small">Developed by Rikisha Maharjan</p>
            <p class="mb-0 small">© 2026 CafeHub. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
